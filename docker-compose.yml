version: '3.8'

services:
  # MBA HUB Core App
  mba-hub:
    build: .
    container_name: mba_hub_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - IDEOGRAM_API_KEY=${IDEOGRAM_API_KEY:-}
      - VECTORIZER_API_KEY=${VECTORIZER_API_KEY:-}
      - VECTORIZER_API_SECRET=${VECTORIZER_API_SECRET:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      - ./data:/app/data
      - ./data/chrome-profile:/app/data/chrome-profile
      - /var/run/docker.sock:/var/run/docker.sock

  # Chrome Session 1: Sync & Login (Passwortfrei auf Port 6080)
  chrome-sync:
    image: lscr.io/linuxserver/chromium:latest
    container_name: mba_chrome_sync
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - CUSTOM_USER=
      - PASSWORD=
      - CHROME_CLI=https://merch.amazon.com/landing
    volumes:
      - ./data/chrome-profile:/config
      - /dev/shm:/dev/shm
    ports:
      - "6080:3000"
    shm_size: '2gb'

  # Chrome Session 2: Upload Worker (Passwortfrei auf Port 6081)
  chrome-upload:
    image: lscr.io/linuxserver/chromium:latest
    container_name: mba_chrome_upload
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - CUSTOM_USER=
      - PASSWORD=
      - CHROME_CLI=https://merch.amazon.com/landing
    volumes:
      - ./data/chrome-profile:/config
      - /dev/shm:/dev/shm
    ports:
      - "6081:3000"
    shm_size: '2gb'

volumes:
  hub_data:

